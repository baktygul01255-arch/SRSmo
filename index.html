<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%20%22%D0%A1%D0%A0%D0%A1-%D0%BD%D0%B0%D0%B2%D0%B8%D0%B3%D0%B0%D1%82%D0%BE%D1%80%22%2C%20%22short_name%22%3A%20%22%D0%A1%D0%A0%D0%A1%22%2C%20%22display%22%3A%20%22standalone%22%2C%20%22background_color%22%3A%20%22%23f1f4f6%22%2C%20%22theme_color%22%3A%20%22%230d6b6f%22%2C%20%22start_url%22%3A%20%22.%22%2C%20%22icons%22%3A%20%5B%7B%22src%22%3A%20%22data%3Aimage/svg%2Bxml%2C%253Csvg%2520xmlns%253D%2527http%253A//www.w3.org/2000/svg%2527%2520viewBox%253D%25270%25200%2520100%2520100%2527%253E%253Crect%2520width%253D%2527100%2527%2520height%253D%2527100%2527%2520rx%253D%252722%2527%2520fill%253D%2527%25230d6b6f%2527/%253E%253Ctext%2520x%253D%252750%2527%2520y%253D%252768%2527%2520font-size%253D%252756%2527%2520text-anchor%253D%2527middle%2527%2520fill%253D%2527%2523fff%2527%2520font-family%253D%2527Georgia%252Cserif%2527%2520font-weight%253D%2527700%2527%253E%25E2%2588%25AB%253C/text%253E%253C/svg%253E%22%2C%20%22sizes%22%3A%20%22any%22%2C%20%22type%22%3A%20%22image/svg%2Bxml%22%2C%20%22purpose%22%3A%20%22any%22%7D%5D%7D"><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Crect%20width%3D%27100%27%20height%3D%27100%27%20rx%3D%2722%27%20fill%3D%27%230d6b6f%27/%3E%3Ctext%20x%3D%2750%27%20y%3D%2768%27%20font-size%3D%2756%27%20text-anchor%3D%27middle%27%20fill%3D%27%23fff%27%20font-family%3D%27Georgia%2Cserif%27%20font-weight%3D%27700%27%3E%E2%88%AB%3C/text%3E%3C/svg%3E"><link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Crect%20width%3D%27100%27%20height%3D%27100%27%20rx%3D%2722%27%20fill%3D%27%230d6b6f%27/%3E%3Ctext%20x%3D%2750%27%20y%3D%2768%27%20font-size%3D%2756%27%20text-anchor%3D%27middle%27%20fill%3D%27%23fff%27%20font-family%3D%27Georgia%2Cserif%27%20font-weight%3D%27700%27%3E%E2%88%AB%3C/text%3E%3C/svg%3E">
<title>СРС-навигатор</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@600;700&display=swap">
<style>
/* Layout: sticky top bar, one centred column (max 1040px); task list as rows; task page is a stepper with a side column of materials. */
:root{
  --bg:#f1f4f6; --surface:#ffffff; --ink:#15212c; --muted:#58697a; --line:#d7dee5;
  --accent:#0d6b6f; --accent-ink:#ffffff; --accent-soft:#dcefef;
  --ok-fg:#1c7447; --ok-bg:#dff3e7; --warn-fg:#8f5b00; --warn-bg:#fbeed0;
  --bad-fg:#a8322b; --bad-bg:#fbe3e0; --info-fg:#2a5aa3; --info-bg:#e1eaf8; --none-fg:#58697a; --none-bg:#e8edf1;
  --c2:#b45309;
  --serif:"Noto Serif",Georgia,"Times New Roman",serif; --sans:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e161d; --surface:#16212b; --ink:#e5ecf2; --muted:#9aabba; --line:#2a3846;
  --accent:#5cc0c3; --accent-ink:#07282a; --accent-soft:#143a3c; --c2:#f0a35a;
  --ok-fg:#6fd19b; --ok-bg:#17352a; --warn-fg:#f0b95a; --warn-bg:#3a2d12;
  --bad-fg:#ff948b; --bad-bg:#3d1c19; --info-fg:#8db4ee; --info-bg:#18283f; --none-fg:#9aabba; --none-bg:#222f3b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e161d; --surface:#16212b; --ink:#e5ecf2; --muted:#9aabba; --line:#2a3846;
  --accent:#5cc0c3; --accent-ink:#07282a; --accent-soft:#143a3c; --c2:#f0a35a;
  --ok-fg:#6fd19b; --ok-bg:#17352a; --warn-fg:#f0b95a; --warn-bg:#3a2d12;
  --bad-fg:#ff948b; --bad-bg:#3d1c19; --info-fg:#8db4ee; --info-bg:#18283f; --none-fg:#9aabba; --none-bg:#222f3b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
.wrap{max-width:1040px;margin:0 auto;padding-block:0 56px}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0;text-wrap:balance}
h2{font-size:22px} h3{font-size:18px} h4{font-size:12px;margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:var(--sans);font-weight:600}
p{margin:0}
a{color:var(--accent)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1040px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-block:10px}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand b{font-family:var(--serif);font-size:18px}
.brand span{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:2px;width:100%;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--warn-bg);color:var(--warn-fg);font-size:12px;text-align:center}
.demo{background:var(--info-bg);color:var(--info-fg);padding:8px 12px;border-radius:8px;margin-top:16px;font-size:13px}
main{display:flex;flex-direction:column;gap:20px;padding-top:20px}
.head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.head p{color:var(--muted);max-width:60ch}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--serif);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:6px;background:var(--none-bg);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.group-t{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:8px}
.group-t span{font-size:13px;color:var(--muted)}
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:34px 1fr auto auto 64px;gap:4px 14px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%}
.row:first-child{border-top:0}
button.row:hover{background:var(--accent-soft)}
.row .n{font-family:var(--serif);font-weight:700;color:var(--muted);font-size:18px;font-variant-numeric:tabular-nums}
.row .t{min-width:0}
.row .t b{display:block;font-weight:600}
.row .t small{color:var(--muted);display:block}
.row .due{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .due.late{color:var(--bad-fg);font-weight:600}
.row .sc{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:640px){.row{grid-template-columns:28px 1fr auto}.row .due{grid-column:2}.row .sc{grid-column:3;grid-row:2}.row .chip{grid-column:3;grid-row:1}}
.chip{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.s-new{background:var(--none-bg);color:var(--none-fg)} .s-draft{background:var(--info-bg);color:var(--info-fg)}
.s-submitted{background:var(--warn-bg);color:var(--warn-fg)} .s-returned{background:var(--bad-bg);color:var(--bad-fg)} .s-graded{background:var(--ok-bg);color:var(--ok-fg)}
.back{border:0;background:transparent;color:var(--accent);font-weight:600;padding:0;align-self:flex-start}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.stepper{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.stepper button{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;padding:0 2px;min-width:44px;color:var(--muted);font-size:11px}
.stepper .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;border:2px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums}
.stepper .done .dot{background:var(--ok-bg);border-color:var(--ok-fg);color:var(--ok-fg)}
.stepper .cur .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stepper .cur{color:var(--ink);font-weight:600}
.stepper button:disabled{opacity:.5;cursor:not-allowed}
.stephead{display:flex;flex-direction:column;gap:4px}
.stephead .kick{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--bg)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin-top:5px;accent-color:var(--accent)}
.opt ul{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
.opt b{display:block}
.crit{border-left:3px solid var(--accent);padding-left:12px}
.lit{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.links{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px}
.links a{overflow-wrap:anywhere}
details summary{cursor:pointer;font-weight:600}
details > :not(summary){margin-top:8px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.f input,label.f textarea,.in{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-weight:400;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:150px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:9px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.bad{border-color:var(--bad-fg);color:var(--bad-fg);background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted);font-size:13px}
.checks{display:flex;flex-direction:column;gap:8px}
.checks label{display:flex;gap:10px;font-size:14px;cursor:pointer}
.checks input{accent-color:var(--accent);margin-top:4px}
.recap{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.recap li{display:flex;gap:8px}
.recap .ok{color:var(--ok-fg);font-weight:700}.recap .no{color:var(--bad-fg);font-weight:700}
.res{display:flex;flex-direction:column;gap:8px}
.res .big{display:flex;align-items:baseline;gap:10px}
.res .big b{font-family:var(--serif);font-size:34px;font-variant-numeric:tabular-nums}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:2px 10px;font-size:13px;align-items:center}
.crow .bar{grid-column:1/-1}
.crow span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;font-size:13px;white-space:nowrap}
th{color:var(--muted);font-weight:600;background:var(--surface)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
tr:last-child td{border-bottom:0}
td button.cell{border:0;border-radius:6px;padding:3px 8px;min-width:40px;font-weight:600}
input[type=date]{width:auto}
.rub{display:grid;grid-template-columns:minmax(0,1fr) 72px;gap:8px 12px;align-items:center}
.rub input{text-align:right}
.total{display:flex;justify-content:space-between;font-weight:700;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:40;max-width:90vw;font-size:14px}
.scale{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;font-size:13px}
.scale div{background:var(--bg);border-radius:6px;padding:6px 8px}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.dt{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.dt table{min-width:100%}
.dt th{font-size:12px;white-space:normal;min-width:96px}
.dt td{padding:4px 6px}
.dt input{width:100%;min-width:72px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px;text-align:right;font-variant-numeric:tabular-nums}
.dt input.txt{text-align:left}
.dt td.calc{color:var(--muted);text-align:right;font-style:italic}
.dt td.x button{border:0;background:transparent;color:var(--muted);font-size:16px;padding:2px 6px}
.dt th:first-child,.dt td:first-child{position:static}
.chartbox{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px}
.chartbox svg{display:block;width:100%;height:auto;max-width:100%}
.an{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:3px}
.sub{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.sub input{margin-top:5px;accent-color:var(--accent)}
.tbhead{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.btn.sm{padding:5px 12px;font-size:13px}
.tips{background:var(--accent-soft);border-radius:10px;padding:12px 14px}
.tips summary{font-weight:700}
.tips h5{margin:10px 0 4px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tips .err{margin-top:10px;background:var(--warn-bg);color:var(--warn-fg);border-radius:8px;padding:8px 10px;font-size:14px}
.tips .err b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
.imgrow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:start}.imgrow img{width:120px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
@media(max-width:520px){.imgrow{grid-template-columns:1fr}}

/* phone */
html{-webkit-text-size-adjust:100%}
body{margin:0;overflow-wrap:break-word}
button,.btn,.seg button,.tabs button{touch-action:manipulation}
@media (max-width:640px){
  body{font-size:16px}
  input,textarea,select,label.f input,label.f textarea,.in{font-size:16px}
  .btn,.seg button,.tabs button,.back{min-height:44px}
  .btn.sm{min-height:40px}
  .seg button{padding:10px 14px}
  .tabs{overflow-x:auto}
  .brand span{display:none}
  .dt td input{min-height:44px;font-size:16px}
  .dt td.x button{min-width:40px;min-height:40px}
  .checks label,.opt{padding-block:8px}
  .checks input[type=checkbox],.opt input[type=checkbox]{width:22px;height:22px;flex:0 0 22px}
  .stepper button:not(.cur) span:nth-child(2){display:none}
  .stepper button.cur span:nth-child(2){font-size:12px}
  .stepper .dot{width:34px;height:34px}
  .panel{padding:14px}
  h2{font-size:20px}
  .nav{position:sticky;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);margin:8px -14px -14px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
  .nav .btn{flex:1 1 auto}
  .nav #saving{order:3;width:100%;text-align:center;font-size:12px}
  .head{flex-wrap:wrap}
  .chartbox svg{width:100%;height:auto}
  .toast{max-width:calc(100vw - 32px);bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
</style>

  <div class="tbl"><table><thead><tr><th>${m.colTask}</th><th>${m.colHrs}</th><th>${m.colDue}</th><th>${m.colSub}</th><th>${m.colGr}</th></tr></thead><tbody>
  ${TASKS.map(t=>{const sub=uids.filter(u=>['submitted','graded'].includes(statusOf(u,t.n))).length, gr=uids.filter(u=>statusOf(u,t.n)==='graded').length;
   return `<tr><td>${t.n}. ${esc(tt(t).title)}</td><td>${t.hours}</td><td><input class="in" id="d-${t.n}" type="date" data-act="due" data-v="${t.n}" value="${esc(due(t.n))}" aria-label="${esc(m.dueFor(t.n))}"></td><td>${sub}/${uids.length}</td><td>${gr}</td></tr>`}).join('')}
  </tbody></table></div>`;
}
function tReview(){
  const m=T(), q=queue(), rv=S.review;
  const list=q.length?`<div class="rows">${q.map(x=>{const t=taskOf(x.n);return `<button class="row" style="grid-template-columns:34px 1fr auto" data-act="grade" data-u="${esc(x.uid)}" data-v="${x.n}"><span class="n">${x.n}</span><span class="t"><b>${esc(nameOf(x.uid))}</b><small>${esc(tt(t).title)}</small></span><span class="due">${m.submittedShort} ${fmtTs(x.at)}</span></button>`}).join('')}</div>`:`<div class="panel empty">${m.queueEmpty}</div>`;
  return `<div class="head"><div><h2>${m.revH}</h2><p>${m.revP}</p></div></div>
  <div class="cols"><div class="stack">${list}</div>${rv?gradePanel(rv.uid,rv.n):`<div class="panel empty">${m.pick}</div>`}</div>`;
}
function gradePanel(uid,n){
  const m=T(), t=taskOf(n), c=tt(t), w=S.work[uid]?.tasks?.[n]||{}, g=gradeOf(uid,n), sc=g?.scores||{};
  const picks=c.forms.filter((_,j)=>w.forms?.[j]).map(f=>f.h).join(', ');
  const steps=c.plan.map((p,i)=>`<div><b>${i+1}. ${esc(p)}</b><p class="pre">${esc((w.steps||[])[i])||'<span class="muted">—</span>'}</p>${TB[n]&&TB[n].step===i?teacherViz(t,w):''}</div>`).join('');
  return `<div class="panel stack" id="gp"><div><h4>${esc(nameOf(uid))} · ${m.task} ${n}</h4><b>${esc(c.title)}</b></div>
    <div class="crit"><p class="muted">${m.critShort}: ${esc(c.crit)}</p></div>
    ${picks?`<div><h4>${m.formsPicked}</h4><p>${esc(picks)}</p></div>`:''}
    <details open><summary>${m.stepsT}</summary><div class="stack">${steps}</div></details>
    <div><h4>${m.conclT}</h4><p class="pre">${esc(w.notes)||`<span class="muted">${m.noText}</span>`}</p>${w.link?`<p><a href="${esc(w.link)}" target="_blank" rel="noopener noreferrer" style="overflow-wrap:anywhere">${esc(w.link)}</a></p>`:''}</div>
    <div class="rub">${RUB().map(r=>`<label for="r-${r[0]}">${r[1]} <span class="muted">(0–${r[2]})</span></label><input class="in" id="r-${r[0]}" type="number" min="0" max="${r[2]}" step="1" inputmode="numeric" data-act="rub" value="${sc[r[0]]??''}">`).join('')}</div>
    <div class="total"><span>${m.total}</span><span id="gtot"></span></div>
    <label class="f">${m.comment}<textarea id="f-comment" style="min-height:80px">${esc(g?.comment)}</textarea></label>
    <div class="acts"><button class="btn ghost" data-act="docx-t">${m.docxBtn}</button><button class="btn" data-act="save-grade">${m.setGrade}</button><button class="btn bad" data-act="return">${m.ret}</button></div></div>`;
}
function tJournal(){
  const m=T(), uids=studentUids().sort((a,b)=>nameOf(a).localeCompare(nameOf(b),loc()));
  if(!uids.length) return `<div class="head"><h2>${m.jH}</h2></div><div class="panel empty">${m.jNone}</div>`;
  return `<div class="head"><div><h2>${m.jH}</h2><p>${m.jP}</p></div><button class="btn ghost" data-act="csv">${m.csv}</button></div>
  <div class="tbl"><table><thead><tr><th>${m.student1}</th>${TASKS.map(t=>`<th title="${esc(tt(t).title)}">${t.n}</th>`).join('')}<th>${m.avgS}</th><th>GPA</th></tr></thead><tbody>
  ${uids.map(u=>{const sm=summary(u);return `<tr><td>${esc(nameOf(u))}</td>${TASKS.map(t=>{const st=statusOf(u,t.n),g=gradeOf(u,t.n);return `<td><button class="cell s-${st}" data-act="grade" data-u="${esc(u)}" data-v="${t.n}" title="${m.st[st]}">${st==='graded'?g.total:st==='new'?'·':st==='submitted'?'✓':st==='returned'?'↺':'…'}</button></td>`}).join('')}<td><b>${sm.avg==null?'—':sm.avg.toFixed(0)}</b></td><td><b>${sm.gpa==null?'—':sm.gpa.toFixed(2)}</b></td></tr>`}).join('')}
  </tbody></table></div><p class="muted">${m.jLegend}</p>`;
}

/* --- memo --- */
function rules(){
  const m=T(), ul=a=>`<ul class="plain">${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  return `<div class="head"><div><h2>${m.memoH}</h2><p>${m.memoP}</p></div></div>
  <div class="cols"><div class="stack">
   <div class="panel"><h4>${m.m1}</h4>${ul(m.m1l)}</div>
   <div class="panel"><h4>${m.m2}</h4>${ul(m.m2l)}</div>
   <div class="panel"><h4>${m.m3}</h4>${ul(m.m3l)}</div>
  </div><div class="stack">
   <div class="panel"><h4>${m.m4} (${maxSum})</h4><div class="rub" style="grid-template-columns:minmax(0,1fr) auto">${RUB().map(r=>`<span>${r[1]}</span><b>${r[2]}</b>`).join('')}</div></div>
   <div class="panel"><h4>${m.m5}</h4><div class="scale">${SCALE.map((s,i)=>`<div><b>${s[1]}</b> · ${s[2].toFixed(2)}<br><span class="muted">${i?`${s[0]}–${SCALE[i-1][0]-1}`:'95–100'}</span></div>`).join('')}</div></div>
   <div class="panel"><h4>${m.m6}</h4>${linkList(DATA.general[L])}</div>
  </div></div>`;
}

/* ---------- events ---------- */
function flash(msg){ S.toast=msg; render(); setTimeout(()=>{S.toast='';render()},3200); }
const toastText = () => typeof S.toast==='function' ? S.toast() : S.toast;
function paintSaving(){ const e=$('#saving'); if(e) e.textContent=savingText(); }
function savingText(){ return S.saving==='saved'?T().saved:S.saving==='saving'?T().saving:''; }
function calcTotal(){
  let tot=0; RUB().forEach(r=>{const el=document.getElementById('r-'+r[0]); if(el&&el.value!=='') tot+=Math.max(0,Math.min(r[2],+el.value||0))});
  const e=$('#gtot'); if(e) e.textContent=`${tot} ${T().outOf} ${maxSum} · ${letter(tot)[1]}`; return tot;
}
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-act]'); if(!b||b.tagName==='INPUT') return;
  const a=b.dataset.act, v=b.dataset.v, n=+v, m=T();
  if(a==='lang'){ L=v; try{localStorage.setItem('srs-lang',L)}catch(_){} render(); }
  else if(a==='mode'){ flushSave(); S.mode=v; S.tab='plan'; S.task=null; render(); }
  else if(a==='tab'){ flushSave(); S.tab=v; S.task=null; render(); }
  else if(a==='open'){ S.task=n; S.tab='plan'; S.step=myTask(n).step||0; render(); window.scrollTo(0,0); }
  else if(a==='close'){ flushSave(); S.task=null; S.resetAsk=null; render(); }
  else if(a==='go'){ if(!b.disabled) goStep(n); }
  else if(a==='profile'){ const nm=$('#f-name').value.trim(); if(!nm){flash(()=>T().enterName);return} const d=myDoc(); d.name=nm; d.group=$('#f-group').value.trim(); persistWork(); render(); }
  else if(a==='submit'){ patchTask(S.task,{submittedAt:Date.now()},true); render(); flash(()=>T().submitted); }
  else if(a==='withdraw'){ patchTask(S.task,{submittedAt:null},true); render(); }
  else if(a==='grade'){ S.mode='teacher'; S.tab='review'; S.review={uid:b.dataset.u,n}; render(); calcTotal(); $('#gp')?.scrollIntoView({block:'nearest'}); }
  else if(a==='save-grade'){ const {uid,n:k}=S.review; const scores={}; let tot=0; RUB().forEach(r=>{const x=Math.max(0,Math.min(r[2],Math.round(+document.getElementById('r-'+r[0]).value||0)));scores[r[0]]=x;tot+=x});
    await saveGrade(uid,k,{scores,total:tot,comment:$('#f-comment').value.trim(),returned:false,at:Date.now()}); S.review=null; render(); flash(()=>T().graded2+': '+tot+' · '+letter(tot)[1]); }
  else if(a==='return'){ const {uid,n:k}=S.review; const c=$('#f-comment').value.trim(); if(!c){flash(()=>T().need);return}
    await saveGrade(uid,k,{scores:{},total:0,comment:c,returned:true,at:Date.now()}); S.review=null; render(); flash(()=>T().returned2); }
  else if(a==='csv'){ exportCsv(); }
  else if(a==='reset-ask'){ S.resetAsk=S.task; render(); }
  else if(a==='reset-no'){ S.resetAsk=null; render(); }
  else if(a==='reset-yes'){ const k=S.task; clearTimeout(saveTimer); saveTimer=null; myDoc().tasks[k]={steps:[],forms:[],notes:'',link:'',self:[],step:0,reached:0,submittedAt:null}; S.resetAsk=null; S.step=0; persistWork(); render(); window.scrollTo(0,0); flash(()=>T().rstDone); }
  else if(a==='docx'){ flushSave(); exportDocx(S.uid,S.task); }
  else if(a==='docx-t'){ exportDocx(S.review.uid,S.review.n); }
  else if(a==='img-del'){ const w=myTask(S.task), im=(w.imgs||[]).slice(); im.splice(n,1); patchTask(S.task,{imgs:im}); render(); }
  else if(a==='row-add'){ const w=myTask(S.task), cfg=TB[S.task], r=tblRows(w,S.task).map(x=>x.slice()); r.push(Array(cfg.cols.length).fill('')); w.tables={...(w.tables||{}),[S.task]:{rows:r}}; scheduleSave(); render(); }
  else if(a==='row-del'){ const w=myTask(S.task), r=tblRows(w,S.task).map(x=>x.slice()); r.splice(n,1); w.tables={...(w.tables||{}),[S.task]:{rows:r}}; scheduleSave(); render(); }
  else if(a==='tb-sample'){ const w=myTask(S.task), cfg=TB[S.task]; w.tables={...(w.tables||{}),[S.task]:{rows:cfg.sample.map(r=>r.map(String))}}; scheduleSave(); render(); }
  else if(a==='tb-clear'){ const w=myTask(S.task), cfg=TB[S.task]; w.tables={...(w.tables||{}),[S.task]:{rows:Array.from({length:5},()=>Array(cfg.cols.length).fill(''))}}; scheduleSave(); render(); }
});
document.addEventListener('change',ev=>{
  const e=ev.target, a=e.dataset?.act;
  if(a==='form'){ const w=myTask(S.task); const p=(w.forms||[]).slice(); p[+e.dataset.v]=e.checked; patchTask(S.task,{forms:p}); render(); }
  else if(a==='self'){ const w=myTask(S.task); const p=(w.self||[]).slice(); p[+e.dataset.v]=e.checked; patchTask(S.task,{self:p}); render(); }
  else if(a==='due'){ S.cfg.deadlines[+e.dataset.v]=e.value; saveCfg(); }
  else if(a==='ref'){ const w=myTask(S.task); patchTask(S.task,{refs:{...(w.refs||{}),[e.dataset.v]:e.checked}}); }
  else if(a==='img-file'){ const f=e.files&&e.files[0]; e.value=''; if(!f) return; const w=myTask(S.task); if((w.imgs||[]).length>=3){flash(()=>T().imgMax);return}
    readImage(f).then(im=>{ if(imgBytes()+im.d.length>650000){flash(()=>T().imgBig);return} patchTask(S.task,{imgs:[...(myTask(S.task).imgs||[]),im]},true); render(); }).catch(()=>flash(()=>T().imgBad)); }
  else if(a==='sub'){ const w=myTask(S.task), i=+e.dataset.i, sb={...(w.sub||{})}, arr=(sb[i]||[]).slice(); arr[+e.dataset.v]=e.checked; sb[i]=arr; patchTask(S.task,{sub:sb}); render(); }
});
document.addEventListener('input',ev=>{
  const e=ev.target;
  if(e.id==='f-step'){ const w=myTask(S.task), s=(w.steps||[]).slice(); const k=S.step-2; while(s.length<k) s.push(''); s[k]=e.value; patchTask(S.task,{steps:s}); toggleNext(); }
  else if(e.id==='f-notes'){ patchTask(S.task,{notes:e.value}); toggleNext(); }
  else if(e.id==='f-link') patchTask(S.task,{link:e.value});
  else if(e.id==='f-college'||e.id==='f-teacher'){ myDoc()[e.id==='f-college'?'college':'teacher']=e.value; scheduleSave(); }
  else if(e.dataset?.act==='img-cap'){ const w=myTask(S.task), im=clone(w.imgs||[]); im[+e.dataset.v].c=e.value; patchTask(S.task,{imgs:im}); }
  else if(e.dataset?.act==='cell'){ const w=myTask(S.task), cfg=TB[S.task], r=tblRows(w,S.task).map(x=>x.slice()); r[+e.dataset.r][+e.dataset.c]=e.value; w.tables={...(w.tables||{}),[S.task]:{rows:r}}; scheduleSave(); refreshViz(); toggleNext(); }
  else if(e.dataset?.act==='rub') calcTotal();
});
function toggleNext(){ // enable the Next button live while typing, without re-rendering the textarea
  const t=taskOf(S.task), w=myTask(S.task), ok=stepOk(t,w,S.step), nb=document.querySelector('.nav .btn:not(.ghost)'), hint=document.querySelector('.nav + p.muted');
  if(nb) nb.disabled=!ok; if(hint) hint.hidden=ok;
}
document.addEventListener('focusout',ev=>{ if(['f-step','f-notes','f-link','f-college','f-teacher'].includes(ev.target.id)||ev.target.dataset?.act==='img-cap'||ev.target.dataset?.act==='cell') flushSave(); });

async function exportCsv(){
  const m=T(), uids=studentUids();
  const rows=[[m.student1,m.group,...TASKS.map(t=>m.task+' '+t.n),m.avgS,'GPA']];
  uids.forEach(u=>{const sm=summary(u);rows.push([nameOf(u),S.work[u].group||'',...TASKS.map(t=>{const s=statusOf(u,t.n);return s==='graded'?gradeOf(u,t.n).total:m.st[s]}),sm.avg==null?'':sm.avg.toFixed(0),sm.gpa==null?'':sm.gpa.toFixed(2)])});
  const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n');
  if(!dl){ flash(()=>T().csvNo); return; }
  try{ await dl.save({filename:'srs-journal.csv',data:csv}); }catch(e){ if(e&&e.code!=='cancelled') flash(()=>T().csvFail); }
}

/* ---------- boot ---------- */
function onOwn(snap){ if(saveTimer) return; S.work[S.uid]=snap.exists?clone(snap.data()):S.work[S.uid]||{name:'',group:'',tasks:{}}; softRender(); }
function softRender(){ const a=document.activeElement; if(a&&(['f-step','f-notes','f-link','f-name','f-group','f-comment','f-college','f-teacher'].includes(a.id)||a.dataset?.act==='cell'||a.dataset?.act==='img-cap')) return; if(a&&a.dataset?.act==='rub') return; render(); }
async function boot(){
  S.sa=true; S.demo=false; S.canEdit=false; S.mode='student'; S.uid='me';
  try{ const raw=localStorage.getItem('srs-work'); S.work.me=raw?JSON.parse(raw):{name:'',group:'',tasks:{}}; }catch(_){ S.work.me={name:'',group:'',tasks:{}}; }
  if(!S.work.me.tasks) S.work.me.tasks={};
  dl={ save:({filename,data})=>new Promise(res=>{ const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data])); const a=document.createElement('a'); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); res({status:'saved'}); }) };
  render();
}
boot();
</script>
</body></html>
